
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ec4899">
  <title>Lovely - Rencontres</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --pink: #ec4899;
      --dark: #db2777;
      --bg: #fff0f6;
      --text: #342330;
      --muted: #806b79;
      --border: #f1dce7;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #fff7fb, #ffe4ef);
    }

    header {
      padding: 20px 16px;
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 720px;
      margin: auto;
    }

    .logo {
      color: var(--pink);
      font-size: 30px;
      font-weight: 900;
    }

    header p {
      color: var(--muted);
      margin: 6px 0 0;
    }

    main {
      width: min(100% - 28px, 560px);
      margin: 28px auto;
      min-height: 60vh;
    }

    .card {
      background: white;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 10px 35px #b82b6810;
      margin-bottom: 20px;
    }

    h1, h2 { text-align: center; }
    h1 { font-size: 28px; }
    h2 { font-size: 23px; }

    .subtitle {
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: 700;
      font-size: 15px;
    }

    input, textarea {
      display: block;
      width: 100%;
      padding: 14px;
      font: inherit;
      color: var(--text);
      background: #fffafd;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px #ec489920;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .primary {
      display: block;
      width: 100%;
      margin-top: 20px;
      background: var(--pink);
      color: white;
    }

    .primary:hover { background: var(--dark); }

    .secondary {
      background: #fff0f6;
      color: var(--dark);
    }

    .switch {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      line-height: 2;
    }

    .switch button {
      padding: 4px;
      color: var(--dark);
      background: transparent;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 14px;
      border-radius: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.show { display: block; }
    .success { color: #17683a; background: #e9f9ef; }
    .error { color: #a21b32; background: #fff0f0; }
    .info { color: #1d4e89; background: #eff6ff; }

    .hidden { display: none !important; }

    .account-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .account-bar strong { overflow-wrap: anywhere; }

    .avatar {
      display: block;
      width: 120px;
      height: 120px;
      margin: 20px auto;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #ffe0ed;
      background: var(--bg);
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 25px 12px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>

<body>
<header>
  <div class="header-inner">
    <div class="logo">♡ LOVELY 💗</div>
    <p>Faites de belles rencontres</p>
  </div>
</header>

<main>
  <div id="notice" class="message" role="status"
       aria-live="polite"></div>

  <section id="authCard" class="card">
    <h1 id="authTitle">Créer un compte</h1>
    <p id="authSubtitle" class="subtitle">
      Rejoignez Lovely et créez votre profil.
    </p>

    <form id="authForm">
      <div id="signupFields">
        <label for="name">Prénom</label>
        <input id="name" type="text" maxlength="60"
               autocomplete="given-name" placeholder="Ex. Sara"
               required>

        <label for="age">Âge (18 ans minimum)</label>
        <input id="age" type="number" min="18" max="100"
               inputmode="numeric" placeholder="18 ou plus"
               required>
      </div>

      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="vous@exemple.com" required>

      <label for="password">Mot de passe</label>
      <input id="password" type="password" minlength="6"
             autocomplete="new-password"
             placeholder="6 caractères minimum" required>

      <button id="authSubmit" class="primary" type="submit">
        Créer mon compte
      </button>
    </form>

    <div class="switch">
      <span id="switchText">Vous avez déjà un compte ?</span>
      <button id="switchMode" type="button">Se connecter</button>
      <br>
      <button id="resetPassword" type="button">
        Mot de passe oublié ?
      </button>
    </div>
  </section>

  <section id="profileCard" class="card hidden">
    <div class="account-bar">
      <strong id="signedInEmail"></strong>
      <button id="logoutButton" class="secondary" type="button">
        Déconnexion
      </button>
    </div>

    <h2>Mon profil Lovely</h2>
    <p class="subtitle">Complétez votre profil.</p>

    <img id="avatarPreview" class="avatar"
      alt="Photo de profil"
      src="https://placehold.co/240x240/fce7f3/be185d?text=Lovely">

    <form id="profileForm">
      <label for="profileName">Prénom</label>
      <input id="profileName" type="text" maxlength="60" required>

      <label for="profileAge">Âge (18 ans minimum)</label>
      <input id="profileAge" type="number" min="18" max="100" required>

      <label for="bio">À propos de moi</label>
      <textarea id="bio" maxlength="500"
        placeholder="Parlez un peu de vous..."></textarea>

      <label for="avatarFile">Photo de profil</label>
      <input id="avatarFile" type="file"
        accept="image/jpeg,image/png,image/webp">

      <p class="hint">
        Formats acceptés : JPG, PNG ou WebP. Taille maximale : 3 Mo.
      </p>

      <button id="saveProfileButton" class="primary" type="submit">
        Enregistrer mon profil
      </button>
    </form>
  </section>
</main>

<footer>LOVELY © 2026 · Respect, sécurité et belles rencontres</footer>

<script>
"use strict";

/* 1. Configuration Supabase */
const SUPABASE_URL =
  "https://tmarzbmxteddwzliluba.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_C6a8W0g77SAW-M9TNZLeWA_8_N71VT-";

const notice = document.getElementById("notice");
const authCard = document.getElementById("authCard");
const profileCard = document.getElementById("profileCard");
const authForm = document.getElementById("authForm");
const profileForm = document.getElementById("profileForm");

const authTitle = document.getElementById("authTitle");
const authSubtitle = document.getElementById("authSubtitle");
const signupFields = document.getElementById("signupFields");
const authSubmit = document.getElementById("authSubmit");
const switchText = document.getElementById("switchText");
const switchMode = document.getElementById("switchMode");

const nameInput = document.getElementById("name");
const ageInput = document.getElementById("age");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const profileName = document.getElementById("profileName");
const profileAge = document.getElementById("profileAge");
const bioInput = document.getElementById("bio");
const avatarFile = document.getElementById("avatarFile");
const avatarPreview = document.getElementById("avatarPreview");
const saveProfileButton = document.getElementById("saveProfileButton");
const logoutButton = document.getElementById("logoutButton");

let mode = "signup";
let currentUser = null;
let currentAvatarUrl = null;
let loadingProfile = false;
let previewObjectUrl = null;

const DEFAULT_AVATAR =
  "https://placehold.co/240x240/fce7f3/be185d?text=Lovely";

/* 2. Vérifier la configuration */
let supabaseClient = null;

try {
  if (!window.supabase) {
    throw new Error("La bibliothèque Supabase ne s'est pas chargée.");
  }

  if (!SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_")) {
    throw new Error("Vérifiez votre Publishable key Supabase.");
  }

  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
} catch (error) {
  showMessage(error.message, "error");
}

function showMessage(message, type = "info") {
  notice.textContent = message;
  notice.className = "message show " + type;
}

function clearMessage() {
  notice.textContent = "";
  notice.className = "message";
}

function friendlyError(error) {
  const m = error?.message || "Une erreur inconnue est survenue.";

  if (/invalid login credentials/i.test(m)) {
    return "E-mail ou mot de passe incorrect.";
  }
  if (/email not confirmed/i.test(m)) {
    return "Confirmez votre adresse e-mail avant de vous connecter.";
  }
  if (/user already registered/i.test(m)) {
    return "Cette adresse e-mail possède déjà un compte. Connectez-vous.";
  }
  if (/row-level security|permission denied/i.test(m)) {
    return "Accès refusé. Vérifiez les politiques RLS de Supabase.";
  }
  if (/could not find the .* column/i.test(m)) {
    return "Une colonne manque dans profiles. Exécutez le SQL fourni avant ce code.";
  }
  if (/failed to fetch|networkerror/i.test(m)) {
    return "Connexion impossible. Vérifiez Internet et la configuration Supabase.";
  }

  return m;
}

function setBusy(button, busy, normalText, busyText) {
  button.disabled = busy;
  button.textContent = busy ? busyText : normalText;
}

/* 3. Changer entre inscription et connexion */
function setMode(nextMode) {
  mode = nextMode;
  const isSignup = mode === "signup";

  authTitle.textContent = isSignup ? "Créer un compte" : "Connexion";
  authSubtitle.textContent = isSignup
    ? "Rejoignez Lovely et créez votre profil."
    : "Connectez-vous pour retrouver votre profil.";

  signupFields.classList.toggle("hidden", !isSignup);
  nameInput.required = isSignup;
  ageInput.required = isSignup;
  passwordInput.autocomplete = isSignup ? "new-password" : "current-password";

  authSubmit.textContent = isSignup ? "Créer mon compte" : "Se connecter";
  switchText.textContent = isSignup
    ? "Vous avez déjà un compte ?"
    : "Vous n'avez pas de compte ?";
  switchMode.textContent = isSignup ? "Se connecter" : "Créer un compte";

  clearMessage();
}

switchMode.addEventListener("click", () => {
  setMode(mode === "signup" ? "login" : "signup");
});

/* 4. Charger le profil */
async function loadProfile(user) {
  const { data, error } = await supabaseClient
    .from("profiles")
    .select("id, name, age, bio, avatar_url")
    .eq("id", user.id)
    .maybeSingle();

  if (error) throw error;

  let profile = data;

  if (!profile) {
    const metadata = user.user_metadata || {};

    const newProfile = {
      id: user.id,
      name: metadata.name || "",
      age: metadata.age ? Number(metadata.age) : null,
      bio: "",
      avatar_url: null
    };

    const { data: inserted, error: insertError } =
      await supabaseClient
        .from("profiles")
        .upsert(newProfile, { onConflict: "id" })
        .select("id, name, age, bio, avatar_url")
        .single();

    if (insertError) throw insertError;
    profile = inserted;
  }

  profileName.value = profile.name || user.user_metadata?.name || "";
  profileAge.value = profile.age || user.user_metadata?.age || "";
  bioInput.value = profile.bio || "";

  currentAvatarUrl = profile.avatar_url || null;
  avatarPreview.src = currentAvatarUrl || DEFAULT_AVATAR;
}

/* 5. Afficher le bon écran */
async function renderSession(user) {
  currentUser = user || null;

  if (!user) {
    authCard.classList.remove("hidden");
    profileCard.classList.add("hidden");
    return;
  }

  authCard.classList.add("hidden");
  profileCard.classList.remove("hidden");
  document.getElementById("signedInEmail").textContent =
    user.email || "Compte Lovely";

  if (loadingProfile) return;
  loadingProfile = true;

  try {
    await loadProfile(user);
  } catch (error) {
    console.error(error);
    showMessage(
      "Connexion réussie, mais chargement du profil impossible : " +
      friendlyError(error),
      "error"
    );
  } finally {
    loadingProfile = false;
  }
}

/* 6. Inscription et connexion */
authForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  clearMessage();

  if (!supabaseClient) {
    showMessage("Configuration Supabase invalide. Vérifiez l'URL et la clé.", "error");
    return;
  }

  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const normalText = mode === "signup" ? "Créer mon compte" : "Se connecter";

  if (!email || !password) {
    showMessage("Remplissez l'e-mail et le mot de passe.", "error");
    return;
  }

  setBusy(authSubmit, true, normalText, "Veuillez patienter...");

  try {
    if (mode === "signup") {
      const name = nameInput.value.trim();
      const age = Number(ageInput.value);

      if (!name) throw new Error("Entrez votre prénom.");
      if (!Number.isInteger(age) || age < 18 || age > 100) {
        throw new Error("L'âge doit être compris entre 18 et 100 ans.");
      }
      if (password.length < 6) {
        throw new Error("Le mot de passe doit contenir au moins 6 caractères.");
      }

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { name, age } }
      });

      if (error) throw error;

      if (data.session && data.user) {
        await renderSession(data.user);
        showMessage("Bienvenue sur Lovely ! Votre compte est créé.", "success");
      } else {
        setMode("login");
        emailInput.value = email;
        showMessage(
          "Compte créé ! Vérifiez votre boîte e-mail et confirmez votre adresse. Ensuite, connectez-vous.",
          "success"
        );
      }
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      await renderSession(data.user);
      showMessage("Connexion réussie. Bienvenue sur Lovely !", "success");
    }
  } catch (error) {
    console.error("Erreur Auth:", error);
    showMessage(friendlyError(error), "error");
  } finally {
    setBusy(
      authSubmit,
      false,
      mode === "signup" ? "Créer mon compte" : "Se connecter",
      ""
    );
  }
});

/* 7. Mot de passe oublié */
document.getElementById("resetPassword").addEventListener("click", async () => {
  if (!supabaseClient) return;

  const email = emailInput.value.trim();

  if (!email) {
    showMessage("Entrez votre adresse e-mail dans le champ ci-dessus.", "info");
    emailInput.focus();
    return;
  }

  try {
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });

    if (error) throw error;

    showMessage(
      "Si cette adresse est enregistrée, vous recevrez un e-mail pour réinitialiser le mot de passe.",
      "success"
    );
  } catch (error) {
    showMessage(friendlyError(error), "error");
  }
});

/* 8. Aperçu de la photo */
avatarFile.addEventListener("change", () => {
  clearMessage();
  const file = avatarFile.files?.[0];

  if (!file) return;

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    avatarFile.value = "";
    showMessage("Choisissez une image JPG, PNG ou WebP.", "error");
    return;
  }

  if (file.size > 3 * 1024 * 1024) {
    avatarFile.value = "";
    showMessage("La photo doit faire moins de 3 Mo.", "error");
    return;
  }

  if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
  previewObjectUrl = URL.createObjectURL(file);
  avatarPreview.src = previewObjectUrl;
});

/* 9. Enregistrer le profil et la photo */
profileForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  clearMessage();

  if (!supabaseClient || !currentUser) {
    showMessage("Connectez-vous avant d'enregistrer votre profil.", "error");
    return;
  }

  const name = profileName.value.trim();
  const age = Number(profileAge.value);
  const bio = bioInput.value.trim();
  const file = avatarFile.files?.[0];

  if (!name) {
    showMessage("Entrez votre prénom.", "error");
    return;
  }

  if (!Number.isInteger(age) || age < 18 || age > 100) {
    showMessage("L'âge doit être compris entre 18 et 100 ans.", "error");
    return;
  }

  setBusy(saveProfileButton, true, "Enregistrer mon profil", "Enregistrement...");

  try {
    let avatarUrl = currentAvatarUrl;

    if (file) {
      if (file.size > 3 * 1024 * 1024) {
        throw new Error("La photo doit faire moins de 3 Mo.");
      }

      const ext = file.type === "image/png" ? "png"
        : file.type === "image/webp" ? "webp" : "jpg";

      const path = currentUser.id + "/" + crypto.randomUUID() + "." + ext;

      const { error: uploadError } = await supabaseClient
        .storage.from("avatars")
        .upload(path, file, {
          contentType: file.type,
          upsert: false
        });

      if (uploadError) throw uploadError;

      const { data } = supabaseClient.storage.from("avatars").getPublicUrl(path);
      avatarUrl = data.publicUrl;
    }

    const { error: profileError } = await supabaseClient
      .from("profiles")
      .upsert({
        id: currentUser.id,
        name,
        age,
        bio,
        avatar_url: avatarUrl
      }, { onConflict: "id" });

    if (profileError) throw profileError;

    currentAvatarUrl = avatarUrl;
    avatarFile.value = "";

    if (previewObjectUrl) {
      URL.revokeObjectURL(previewObjectUrl);
      previewObjectUrl = null;
    }

    avatarPreview.src = avatarUrl || DEFAULT_AVATAR;

    const { error: metadataError } = await supabaseClient.auth.updateUser({
      data: { name, age }
    });

    if (metadataError) console.warn(metadataError);

    showMessage("Votre profil a été enregistré avec succès !", "success");
  } catch (error) {
    console.error("Erreur profil:", error);
    showMessage(friendlyError(error), "error");
  } finally {
    setBusy(saveProfileButton, false, "Enregistrer mon profil", "");
  }
});

/* 10. Déconnexion */
logoutButton.addEventListener("click", async () => {
  if (!supabaseClient) return;

  logoutButton.disabled = true;

  try {
    const { error } = await supabaseClient.auth.signOut();
    if (error) throw error;

    currentUser = null;
    currentAvatarUrl = null;
    authForm.reset();
    profileForm.reset();
    setMode("login");
    await renderSession(null);
    showMessage("Vous êtes déconnecté.", "success");
  } catch (error) {
    showMessage(friendlyError(error), "error");
  } finally {
    logoutButton.disabled = false;
  }
});

/* 11. Restaurer la session au chargement */
async function init() {
  if (!supabaseClient) {
    showMessage(
      "Configuration Supabase introuvable. Vérifiez la clé Publishable dans index.html.",
      "error"
    );
    return;
  }

  try {
    const { data, error } = await supabaseClient.auth.getSession();
    if (error) throw error;
    await renderSession(data.session?.user || null);
  } catch (error) {
    console.error(error);
    showMessage(friendlyError(error), "error");
  }
}
