
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ec4899">
  <title>LOVELY - Rencontres</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --pink: #ec4899;
      --pink-dark: #db2777;
      --bg: #fff5f9;
      --text: #352432;
      --muted: #806b79;
      --border: #f3dce8;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #fff5f9, #ffe4ef);
      min-height: 100vh;
    }

    header {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      color: var(--pink-dark);
    }

    .tagline {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    main {
      width: min(100% - 26px, 540px);
      margin: 25px auto;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 23px;
      margin-bottom: 18px;
      box-shadow: 0 10px 35px #b82b6810;
    }

    h1, h2 { text-align: center; margin-top: 0; }
    h1 { font-size: 25px; }
    h2 { font-size: 21px; }

    .subtitle {
      text-align: center;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin: 15px 0 7px;
    }

    input, textarea {
      display: block;
      width: 100%;
      padding: 13px;
      font: inherit;
      color: var(--text);
      background: #fffafd;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px #ec489918;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 12px 15px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    .primary {
      display: block;
      width: 100%;
      margin-top: 18px;
      background: var(--pink);
      color: white;
    }

    .primary:hover { background: var(--pink-dark); }

    .secondary {
      background: #fff0f6;
      color: var(--pink-dark);
    }

    .switch {
      text-align: center;
      margin-top: 17px;
      color: var(--muted);
      font-size: 14px;
    }

    .switch button {
      background: transparent;
      color: var(--pink-dark);
      padding: 5px;
    }

    .hidden { display: none !important; }

    #notice {
      display: none;
      padding: 13px;
      border-radius: 11px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #notice.show { display: block; }
    #notice.success { background: #e7f8ed; color: #17683a; }
    #notice.error { background: #fff0f0; color: #a21b32; }
    #notice.info { background: #eff6ff; color: #1d4e89; }

    .avatar {
      display: block;
      width: 115px;
      height: 115px;
      border-radius: 50%;
      object-fit: cover;
      margin: 15px auto;
      border: 4px solid #ffe0ed;
      background: #fff0f6;
    }

    .account-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    #signedInEmail { overflow-wrap: anywhere; }

    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    footer {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <div>
      <div class="logo">♡ LOVELY</div>
      <div class="tagline">Faites de belles rencontres</div>
    </div>
    <span aria-hidden="true">💗</span>
  </header>

  <main>
    <div id="notice" role="status" aria-live="polite"></div>

    <!-- Inscription / connexion -->
    <section id="authCard" class="card">
      <h1 id="authTitle">Créer un compte</h1>
      <p class="subtitle" id="authSubtitle">
        Rejoignez Lovely et créez votre profil.
      </p>

      <form id="authForm">
        <div id="signupFields">
          <label for="name">Prénom</label>
          <input id="name" type="text" maxlength="60"
                 autocomplete="given-name" required>

          <label for="age">Âge (18 ans minimum)</label>
          <input id="age" type="number" min="18" max="100"
                 inputmode="numeric" required>
        </div>

        <label for="email">Adresse e-mail</label>
        <input id="email" type="email" autocomplete="email"
               placeholder="vous@exemple.com" required>

        <label for="password">Mot de passe</label>
        <input id="password" type="password" minlength="6"
               autocomplete="current-password"
               placeholder="6 caractères minimum" required>

        <button id="authSubmit" class="primary" type="submit">
          Créer mon compte
        </button>
      </form>

      <div class="switch">
        <span id="switchText">Vous avez déjà un compte ?</span>
        <button id="switchMode" type="button">Se connecter</button>
      </div>
    </section>

    <!-- Espace personnel -->
    <section id="profileCard" class="card hidden">
      <div class="account-bar">
        <strong id="signedInEmail"></strong>
        <button id="logoutButton" class="secondary" type="button">
          Déconnexion
        </button>
      </div>

      <h2>Mon profil Lovely</h2>
      <p class="subtitle">Complétez votre profil.</p>

      <img id="avatarPreview"
           class="avatar"
           alt="Photo de profil"
           src="https://placehold.co/220x220/fce7f3/be185d?text=Lovely">

      <form id="profileForm">
        <label for="profileName">Prénom</label>
        <input id="profileName" type="text" maxlength="60" required>

        <label for="profileAge">Âge</label>
        <input id="profileAge" type="number" min="18" max="100" required>

        <label for="bio">À propos de moi</label>
        <textarea id="bio" maxlength="500"
                  placeholder="Parlez un peu de vous..."></textarea>

        <label for="avatarFile">Photo de profil</label>
        <input id="avatarFile" type="file"
               accept="image/jpeg,image/png,image/webp">
        <p class="hint">JPG, PNG ou WebP. Maximum 3 Mo.</p>

        <button id="saveProfileButton" class="primary" type="submit">
          Enregistrer mon profil
        </button>
      </form>
    </section>
  </main>

  <footer>LOVELY © 2026 · Rencontres respectueuses</footer>

  <script>
    "use strict";

    // CONFIGURATION SUPABASE
    const SUPABASE_URL =
      "https://tmarzbmxteddwzliluba.supabase.co";

    // Remplace cette valeur par la Publishable key COMPLÈTE
    // de ton projet Supabase. N'utilise JAMAIS une secret key ici.
    const SUPABASE_PUBLISHABLE_KEY =
      "COLLE_ICI_TA_PUBLISHABLE_KEY_COMPLETE";

    if (!window.supabase) {
      document.getElementById("notice").textContent =
        "La bibliothèque Supabase n'a pas chargé. Vérifiez votre connexion Internet.";
      document.getElementById("notice").className = "show error";
      throw new Error("Supabase JS non chargé");
    }

    if (SUPABASE_PUBLISHABLE_KEY.includes("COLLE_ICI")) {
      document.getElementById("notice").textContent =
        "Ajoutez votre Publishable key Supabase dans le code avant de continuer.";
      document.getElementById("notice").className = "show error";
      throw new Error("Publishable key manquante");
    }

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const $ = (id) => document.getElementById(id);

    let mode = "signup";
    let currentUser = null;
    let currentAvatarUrl = null;
    let previewObjectUrl = null;

    function message(text, type = "info") {
      $("notice").textContent = text;
      $("notice").className = "show " + type;
    }

    function clearMessage() {
      $("notice").textContent = "";
      $("notice").className = "";
    }

    function friendlyError(error) {
      const m = error?.message || "Une erreur inconnue est survenue.";

      if (/invalid login credentials/i.test(m))
        return "Adresse e-mail ou mot de passe incorrect.";

      if (/email not confirmed/i.test(m))
        return "Veuillez confirmer votre adresse e-mail avant de vous connecter.";

      if (/user already registered/i.test(m))
        return "Cette adresse e-mail possède déjà un compte. Connectez-vous.";

      if (/row-level security|permission denied/i.test(m))
        return "Accès refusé. Vérifiez les politiques RLS de Supabase.";

      if (/duplicate key/i.test(m))
        return "Ce profil existe déjà. Rechargez la page puis réessayez.";

      return m;
    }

    function busy(button, value, text) {
      button.disabled = value;
      if (value) {
        button.dataset.oldText = button.textContent;
        button.textContent = text;
      } else {
        button.textContent = button.dataset.oldText || text;
      }
    }

    function setMode(next) {
      mode = next;
      const signup = mode === "signup";

      $("authTitle").textContent =
        signup ? "Créer un compte" : "Connexion";

      $("authSubtitle").textContent = signup
        ? "Rejoignez Lovely et créez votre profil."
        : "Connectez-vous pour retrouver votre profil.";

      $("signupFields").classList.toggle("hidden", !signup);
      $("name").required = signup;
      $("age").required = signup;

      $("password").autocomplete =
        signup ? "new-password" : "current-password";

      $("authSubmit").textContent =
        signup ? "Créer mon compte" : "Se connecter";

      $("switchText").textContent = signup
        ? "Vous avez déjà un compte ?"
        : "Vous n'avez pas de compte ?";

      $("switchMode").textContent =
        signup ? "Se connecter" : "Créer un compte";

      clearMessage();
    }

    $("switchMode").addEventListener("click", () => {
      setMode(mode === "signup" ? "login" : "signup");
    });

    // إنشاء البروفايل غير إلا ما كانش موجود
    // حتى ما يتمسحش الوصف والصورة فكل تسجيل دخول.
    async function ensureProfile(user) {
      const { data, error } = await db
        .from("profiles")
        .select("id")
        .eq("id", user.id)
        .maybeSingle();

      if (error) throw error;
      if (data) return;

      const metadata = user.user_metadata || {};

      const { error: insertError } = await db
        .from("profiles")
        .insert({
          id: user.id,
          name: metadata.name || "",
          age: metadata.age ? Number(metadata.age) : null,
          bio: "",
          avatar_url: null
        });

      if (insertError) throw insertError;
    }

    async function loadProfile(user) {
      await ensureProfile(user);

      const { data, error } = await db
        .from("profiles")
        .select("id,name,age,bio,avatar_url")
        .eq("id", user.id)
        .single();

      if (error) throw error;

      $("profileName").value = data.name || "";
      $("profileAge").value = data.age || "";
      $("bio").value = data.bio || "";

      currentAvatarUrl = data.avatar_url || null;

      $("avatarPreview").src = currentAvatarUrl ||
        "https://placehold.co/220x220/fce7f3/be185d?text=Lovely";
    }

    async function showSession(user) {
      currentUser = user || null;

      if (!user) {
        $("authCard").classList.remove("hidden");
        $("profileCard").classList.add("hidden");
        return;
      }

      $("authCard").classList.add("hidden");
      $("profileCard").classList.remove("hidden");
      $("signedInEmail").textContent = user.email || "Mon compte";

      try {
        await loadProfile(user);
      } catch (error) {
        console.error(error);
        message(
          "Connexion réussie, mais le profil n'a pas pu être chargé : " +
          friendlyError(error),
          "error"
        );
      }
    }

    // INSCRIPTION ET CONNEXION
    $("authForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage();

      const button = $("authSubmit");
      busy(button, true, "Veuillez patienter...");

      try {
        const email = $("email").value.trim();
        const password = $("password").value;

        if (mode === "signup") {
          const name = $("name").value.trim();
          const age = Number($("age").value);

          if (!name) throw new Error("Entrez votre prénom.");
          if (!Number.isInteger(age) || age < 18 || age > 100)
            throw new Error("Vous devez avoir entre 18 et 100 ans.");
          if (password.length < 6)
            throw new Error("Le mot de passe doit contenir au moins 6 caractères.");

          const { data, error } = await db.auth.signUp({
            email,
            password,
            options: { data: { name, age } }
          });

          if (error) throw error;

          if (data.session && data.user) {
            await showSession(data.user);
            message("Votre compte Lovely a été créé !", "success");
          } else {
            setMode("login");
            $("email").value = email;
            message(
              "Compte créé. Vérifiez votre boîte e-mail, confirmez votre adresse, puis connectez-vous.",
              "success"
            );
          }
        } else {
          const { data, error } = await db.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          await showSession(data.user);
          message("Connexion réussie ! Bienvenue sur Lovely.", "success");
        }
      } catch (error) {
        console.error(error);
        message(friendlyError(error), "error");
      } finally {
        busy(button, false, "");
      }
    });

    // APERÇU PHOTO
    $("avatarFile").addEventListener("change", () => {
      const file = $("avatarFile").files?.[0];
      if (!file) return;

      if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
        $("avatarFile").value = "";
        message("Choisissez une image JPG, PNG ou WebP.", "error");
        return;
      }

      if (file.size > 3 * 1024 * 1024) {
        $("avatarFile").value = "";
        message("La photo ne doit pas dépasser 3 Mo.", "error");
        return;
      }

      if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
      previewObjectUrl = URL.createObjectURL(file);
      $("avatarPreview").src = previewObjectUrl;
      clearMessage();
    });

    // SAUVEGARDE DU PROFIL ET DE LA PHOTO
    $("profileForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage();

      if (!currentUser) {
        message("Veuillez vous connecter.", "error");
        return;
      }

      const name = $("profileName").value.trim();
      const age = Number($("profileAge").value);
      const bio = $("bio").value.trim();
      const file = $("avatarFile").files?.[0];
      const button = $("saveProfileButton");

      if (!name) {
        message("Entrez votre prénom.", "error");
        return;
      }

      if (!Number.isInteger(age) || age < 18 || age > 100) {
        message("L'âge doit être compris entre 18 et 100 ans.", "error");
        return;
      }

      busy(button, true, "Enregistrement...");

      try {
        let avatarUrl = currentAvatarUrl;

        if (file) {
          const extension = file.type === "image/png" ? "png" :
            file.type === "image/webp" ? "webp" : "jpg";

          const path = currentUser.id + "/" +
            crypto.randomUUID() + "." + extension;

          const { error: uploadError } = await db.storage
            .from("avatars")
            .upload(path, file, {
              contentType: file.type,
              upsert: false
            });

          if (uploadError) throw uploadError;

          const { data: publicData } = db.storage
            .from("avatars")
            .getPublicUrl(path);

          avatarUrl = publicData.publicUrl;
        }

        const { error } = await db.from("profiles").upsert({
          id: currentUser.id,
          name,
          age,
          bio,
          avatar_url: avatarUrl
        }, { onConflict: "id" });

        if (error) throw error;

        currentAvatarUrl = avatarUrl;
        $("avatarFile").value = "";

        if (previewObjectUrl) {
          URL.revokeObjectURL(previewObjectUrl);
          previewObjectUrl = null;
        }

        $("avatarPreview").src = avatarUrl ||
          "https://placehold.co/220x220/fce7f3/be185d?text=Lovely";

        message("Votre profil a été enregistré avec succès !", "success");
      } catch (error) {
        console.error(error);
        message(friendlyError(error), "error");
      } finally {
        busy(button, false, "");
      }
    });

    // DÉCONNEXION
    $("logoutButton").addEventListener("click", async () => {
      const button = $("logoutButton");
      button.disabled = true;

      try {
        const { error } = await db.auth.signOut();
        if (error) throw error;

        currentUser = null;
        $("profileForm").reset();
        $("authForm").reset();
        setMode("login");
        await showSession(null);
        message("Vous êtes déconnecté.", "success");
      } catch (error) {
        message(friendlyError(error), "error");
      } finally {
        button.disabled = false;
      }
    });

    // RESTAURER LA SESSION
    async function init() {
      try {
        const { data, error } = await db.auth.getSession();
        if (error) throw error;

        await showSession(data.session?.user || null);
      } catch (error) {
        console.error(error);
        message(
          "Impossible de charger votre session. Vérifiez la clé Supabase, les politiques RLS et Internet.",
          "error"
        );
      }
    }

    // مراقبة الخروج من الحساب
    db.auth.onAuthStateChange((event) => {
      if (event === "SIGNED_OUT") {
        currentUser = null;
        $("authCard").classList.remove("hidden");
        $("profileCard").classList.add("hidden");
      }
    });

    setMode("signup");
    init();
  </script>
</body>
</html>
