
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e72b83">
  <title>Lovely - Rencontres</title>
  <meta name="description" content="Créez votre profil Lovely et faites de belles rencontres.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --pink: #e72b83;
      --pink-dark: #c91c6c;
      --bg: #fff0f7;
      --text: #352532;
      --muted: #806f7c;
      --border: #f0dce7;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(140deg, #fff7fb, #ffe4f0);
    }

    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 22px 16px;
    }

    .header-inner {
      max-width: 760px;
      margin: auto;
    }

    .logo {
      color: var(--pink);
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    header p {
      margin: 7px 0 0;
      color: var(--muted);
    }

    main {
      width: min(100% - 28px, 560px);
      margin: 28px auto;
      min-height: 55vh;
    }

    .card {
      background: var(--white);
      padding: 26px;
      border: 1px solid var(--border);
      border-radius: 25px;
      box-shadow: 0 12px 35px #8f245010;
      margin-bottom: 22px;
    }

    h1, h2 { text-align: center; margin: 0 0 16px; }
    h1 { font-size: 30px; }
    h2 { font-size: 25px; }

    .subtitle {
      text-align: center;
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 22px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      font-weight: 700;
      font-size: 15px;
    }

    input, textarea {
      width: 100%;
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #fffafd;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px #e72b831c;
    }

    textarea { min-height: 110px; resize: vertical; }

    button {
      font: inherit;
      font-weight: 700;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    .primary {
      width: 100%;
      margin-top: 20px;
      color: #fff;
      background: var(--pink);
    }

    .primary:hover { background: var(--pink-dark); }

    .secondary {
      color: var(--pink-dark);
      background: #fff0f6;
    }

    .switch {
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      line-height: 1.8;
    }

    .link-button {
      padding: 4px;
      color: var(--pink-dark);
      background: transparent;
    }

    .notice {
      display: none;
      padding: 15px 17px;
      border-radius: 13px;
      margin-bottom: 20px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .notice.show { display: block; }
    .notice.error { background: #fff0f0; color: #9b263b; }
    .notice.success { background: #e8f8ee; color: #21683d; }
    .notice.info { background: #edf5ff; color: #244f83; }

    .hidden { display: none !important; }

    .account-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .account-bar strong { overflow-wrap: anywhere; }

    .avatar {
      display: block;
      width: 124px;
      height: 124px;
      object-fit: cover;
      border: 4px solid #ffe0ed;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: #fff0f6;
    }

    .hint {
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 22px 14px 32px;
      font-size: 13px;
    }

    @media (max-width: 420px) {
      .card { padding: 21px 18px; }
      h1 { font-size: 27px; }
      .logo { font-size: 28px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="logo">♡ LOVELY</div>
      <p>Faites de belles rencontres</p>
    </div>
  </header>

  <main>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>

    <section id="authCard" class="card">
      <h1 id="authTitle">Créer un compte</h1>
      <p id="authSubtitle" class="subtitle">
        Rejoignez Lovely et créez votre profil.
      </p>

      <form id="authForm">
        <div id="signupFields">
          <label for="name">Prénom</label>
          <input id="name" type="text" maxlength="60"
                 autocomplete="given-name" placeholder="Ex. Sara" required>

          <label for="age">Âge (18 ans minimum)</label>
          <input id="age" type="number" min="18" max="100"
                 inputmode="numeric" placeholder="18 ou plus" required>
        </div>

        <label for="email">Adresse e-mail</label>
        <input id="email" type="email" autocomplete="email"
               placeholder="vous@exemple.com" required>

        <label for="password">Mot de passe</label>
        <input id="password" type="password" minlength="6"
               autocomplete="new-password"
               placeholder="6 caractères minimum" required>

        <button id="authSubmit" class="primary" type="submit">
          Créer mon compte
        </button>
      </form>

      <div class="switch">
        <span id="switchText">Vous avez déjà un compte ?</span>
        <button id="switchMode" class="link-button" type="button">
          Se connecter
        </button>
      </div>
    </section>

    <section id="profileCard" class="card hidden">
      <div class="account-bar">
        <strong id="signedInEmail"></strong>
        <button id="logoutButton" class="secondary" type="button">
          Déconnexion
        </button>
      </div>

      <h2>Mon profil Lovely</h2>
      <p class="subtitle">Complétez votre profil.</p>

      <img id="avatarPreview" class="avatar"
           alt="Photo de profil"
           src="https://placehold.co/240x240/fce7f3/be185d?text=Lovely">

      <form id="profileForm">
        <label for="profileName">Prénom</label>
        <input id="profileName" type="text" maxlength="60" required>

        <label for="profileAge">Âge (18 ans minimum)</label>
        <input id="profileAge" type="number" min="18" max="100" required>

        <label for="bio">À propos de moi</label>
        <textarea id="bio" maxlength="500"
                  placeholder="Parlez un peu de vous..."></textarea>

        <label for="avatarFile">Photo de profil</label>
        <input id="avatarFile" type="file"
               accept="image/jpeg,image/png,image/webp">
        <p class="hint">JPG, PNG ou WebP. Taille maximale : 3 Mo.</p>

        <button id="saveProfileButton" class="primary" type="submit">
          Enregistrer mon profil
        </button>
      </form>
    </section>
  </main>

  <footer>LOVELY © 2026 · Respect, sécurité et belles rencontres</footer>

  <script>
    "use strict";

    // CONFIGURATION SUPABASE
    const SUPABASE_URL = "https://tmarzbmxteddwzliluba.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_C6a8W0g77SAW-M9TNZLeWA_8_N71VT-";

    const notice = document.getElementById("notice");
    const authCard = document.getElementById("authCard");
    const profileCard = document.getElementById("profileCard");
    const authForm = document.getElementById("authForm");
    const profileForm = document.getElementById("profileForm");

    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");
    const signupFields = document.getElementById("signupFields");
    const authSubmit = document.getElementById("authSubmit");
    const switchText = document.getElementById("switchText");
    const switchMode = document.getElementById("switchMode");

    const nameInput = document.getElementById("name");
    const ageInput = document.getElementById("age");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const profileName = document.getElementById("profileName");
    const profileAge = document.getElementById("profileAge");
    const bioInput = document.getElementById("bio");
    const avatarFile = document.getElementById("avatarFile");
    const avatarPreview = document.getElementById("avatarPreview");
    const saveProfileButton = document.getElementById("saveProfileButton");
    const logoutButton = document.getElementById("logoutButton");

    const DEFAULT_AVATAR =
      "https://placehold.co/240x240/fce7f3/be185d?text=Lovely";

    let supabaseClient = null;
    let mode = "signup";
    let currentUser = null;
    let currentAvatarUrl = null;
    let previewObjectUrl = null;
    let renderVersion = 0;

    function showMessage(message, type = "info") {
      notice.textContent = message;
      notice.className = "notice show " + type;
    }

    function clearMessage() {
      notice.textContent = "";
      notice.className = "notice";
    }

    function friendlyError(error) {
      const message = error?.message || String(error || "Erreur inconnue");

      if (/invalid login credentials/i.test(message))
        return "Adresse e-mail ou mot de passe incorrect.";

      if (/email not confirmed/i.test(message))
        return "Confirmez votre adresse e-mail avant de vous connecter.";

      if (/user already registered/i.test(message))
        return "Cette adresse e-mail possède déjà un compte. Connectez-vous.";

      if (/row-level security|permission denied/i.test(message))
        return "Accès refusé. Vérifiez les politiques RLS dans Supabase.";

      if (/could not find the .* column/i.test(message))
        return "Une colonne manque dans profiles. Exécutez le SQL de réparation fourni.";

      if (/failed to fetch|networkerror/i.test(message))
        return "Connexion impossible. Vérifiez Internet et la configuration Supabase.";

      if (/bucket not found/i.test(message))
        return "Le bucket avatars est introuvable. Exécutez le SQL fourni.";

      return message;
    }

    function setBusy(button, busy, normalText, busyText) {
      button.disabled = busy;
      button.textContent = busy ? busyText : normalText;
    }

    function setMode(nextMode) {
      mode = nextMode;
      const signup = mode === "signup";

      authTitle.textContent = signup ? "Créer un compte" : "Connexion";
      authSubtitle.textContent = signup
        ? "Rejoignez Lovely et créez votre profil."
        : "Connectez-vous pour retrouver votre profil.";

      signupFields.classList.toggle("hidden", !signup);
      nameInput.required = signup;
      ageInput.required = signup;
      passwordInput.autocomplete = signup
        ? "new-password" : "current-password";

      authSubmit.textContent = signup
        ? "Créer mon compte" : "Se connecter";

      switchText.textContent = signup
        ? "Vous avez déjà un compte ?" : "Vous n'avez pas de compte ?";

      switchMode.textContent = signup
        ? "Se connecter" : "Créer un compte";

      clearMessage();
    }

    switchMode.addEventListener("click", () => {
      setMode(mode === "signup" ? "login" : "signup");
    });

    async function saveProfileRow(user, fields = {}) {
      const row = {
        id: user.id,
        name: fields.name ?? user.user_metadata?.name ?? "",
        age: fields.age ?? user.user_metadata?.age ?? null,
        bio: fields.bio ?? "",
        avatar_url: fields.avatar_url ?? null,
        updated_at: new Date().toISOString()
      };

      const { error } = await supabaseClient
        .from("profiles")
        .upsert(row, { onConflict: "id" });

      if (error) throw error;
    }

    async function loadProfile(user) {
      const { data, error } = await supabaseClient
        .from("profiles")
        .select("id,name,age,bio,avatar_url")
        .eq("id", user.id)
        .maybeSingle();

      if (error) throw error;

      if (!data) {
        await saveProfileRow(user);
        return loadProfile(user);
      }

      profileName.value = data.name || user.user_metadata?.name || "";
      profileAge.value = data.age ?? user.user_metadata?.age ?? "";
      bioInput.value = data.bio || "";

      currentAvatarUrl = data.avatar_url || null;
      avatarPreview.src = currentAvatarUrl || DEFAULT_AVATAR;
    }

    async function renderSession(user) {
      const version = ++renderVersion;
      currentUser = user || null;

      if (!user) {
        authCard.classList.remove("hidden");
        profileCard.classList.add("hidden");
        return;
      }

      authCard.classList.add("hidden");
      profileCard.classList.remove("hidden");
      document.getElementById("signedInEmail").textContent =
        user.email || "Compte Lovely";

      try {
        await loadProfile(user);
      } catch (error) {
        console.error("Erreur de profil:", error);
        if (version === renderVersion) {
          showMessage(
            "Connexion réussie, mais le profil n'a pas pu être chargé : " +
            friendlyError(error),
            "error"
          );
        }
      }
    }

    async function initApp() {
      if (!window.supabase || !window.supabase.createClient) {
        showMessage(
          "La bibliothèque Supabase ne s'est pas chargée. Vérifiez Internet et rechargez la page.",
          "error"
        );
        authSubmit.disabled = true;
        return;
      }

      if (
        !SUPABASE_URL.startsWith("https://") ||
        !SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_")
      ) {
        showMessage(
          "Vérifiez le Project URL et la Publishable key dans le code.",
          "error"
        );
        authSubmit.disabled = true;
        return;
      }

      try {
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );

        const { data, error } = await supabaseClient.auth.getSession();
        if (error) throw error;

        await renderSession(data.session?.user || null);
      } catch (error) {
        console.error("Erreur d'initialisation:", error);
        showMessage(friendlyError(error), "error");
      }
    }

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage();

      if (!supabaseClient) {
        showMessage("Supabase n'est pas encore initialisé. Rechargez la page.", "error");
        return;
      }

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (password.length < 6) {
        showMessage("Le mot de passe doit contenir au moins 6 caractères.", "error");
        return;
      }

      const signup = mode === "signup";
      const normalText = signup ? "Créer mon compte" : "Se connecter";
      setBusy(authSubmit, true, normalText, "Veuillez patienter...");

      try {
        if (signup) {
          const name = nameInput.value.trim();
          const age = Number(ageInput.value);

          if (!name) throw new Error("Entrez votre prénom.");
          if (!Number.isInteger(age) || age < 18 || age > 100)
            throw new Error("L'âge doit être compris entre 18 et 100 ans.");

          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              data: { name, age }
            }
          });

          if (error) throw error;

          if (data.session && data.user) {
            await saveProfileRow(data.user, {
              name, age, bio: "", avatar_url: null
            });
            await renderSession(data.user);
            showMessage("Bienvenue sur Lovely ! Votre compte est créé.", "success");
          } else {
            setMode("login");
            emailInput.value = email;
            showMessage(
              "Compte créé ! Consultez votre e-mail et cliquez sur le lien de confirmation, puis connectez-vous.",
              "success"
            );
          }
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          await renderSession(data.user);
          showMessage("Connexion réussie. Bienvenue sur Lovely !", "success");
        }
      } catch (error) {
        console.error("Erreur d'authentification:", error);
        showMessage(friendlyError(error), "error");
      } finally {
        setBusy(
          authSubmit,
          false,
          mode === "signup" ? "Créer mon compte" : "Se connecter",
          "Veuillez patienter..."
        );
      }
    });

    avatarFile.addEventListener("change", () => {
      const file = avatarFile.files?.[0];
      if (!file) return;

      const allowed = ["image/jpeg", "image/png", "image/webp"];

      if (!allowed.includes(file.type)) {
        avatarFile.value = "";
        showMessage("Choisissez une image JPG, PNG ou WebP.", "error");
        return;
      }

      if (file.size > 3 * 1024 * 1024) {
        avatarFile.value = "";
        showMessage("La photo ne doit pas dépasser 3 Mo.", "error");
        return;
      }

      if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
      previewObjectUrl = URL.createObjectURL(file);
      avatarPreview.src = previewObjectUrl;
      clearMessage();
    });

    profileForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage();

      if (!supabaseClient || !currentUser) {
        showMessage("Connectez-vous avant d'enregistrer votre profil.", "error");
        return;
      }

      const name = profileName.value.trim();
      const age = Number(profileAge.value);
      const bio = bioInput.value.trim();
      const file = avatarFile.files?.[0];

      if (!name) {
        showMessage("Entrez votre prénom.", "error");
        return;
      }

      if (!Number.isInteger(age) || age < 18 || age > 100) {
        showMessage("L'âge doit être compris entre 18 et 100 ans.", "error");
        return;
      }

      setBusy(
        saveProfileButton, true,
        "Enregistrer mon profil", "Enregistrement..."
      );

      try {
        let avatarUrl = currentAvatarUrl;

        if (file) {
          const extension = file.type === "image/png" ? "png" :
            file.type === "image/webp" ? "webp" : "jpg";

          const path = currentUser.id + "/" + Date.now() + "." + extension;

          const { error: uploadError } = await supabaseClient
            .storage.from("avatars")
            .upload(path, file, {
              contentType: file.type,
              upsert: false
            });

          if (uploadError) throw uploadError;

          const { data: publicData } = supabaseClient
            .storage.from("avatars")
            .getPublicUrl(path);

          avatarUrl = publicData.publicUrl;
        }

        await saveProfileRow(currentUser, {
          name, age, bio, avatar_url: avatarUrl
        });

        currentAvatarUrl = avatarUrl;
        avatarFile.value = "";

        if (previewObjectUrl) {
          URL.revokeObjectURL(previewObjectUrl);
          previewObjectUrl = null;
        }

        avatarPreview.src = avatarUrl || DEFAULT_AVATAR;

        const { error: metadataError } =
          await supabaseClient.auth.updateUser({
            data: { name, age }
          });

        if (metadataError) {
          console.warn("Métadonnées non actualisées:", metadataError);
        }

        showMessage("Votre profil a été enregistré avec succès !", "success");
      } catch (error) {
        console.error("Erreur d'enregistrement:", error);
