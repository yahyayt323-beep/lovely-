<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ec4899">
  <title>Lovely - Rencontres</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --pink: #ec4899;
      --dark-pink: #db2777;
      --bg: #fff1f7;
      --text: #342330;
      --muted: #806b79;
      --border: #f1dce7;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #fff7fb, #ffe4ef);
      min-height: 100vh;
    }

    header {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 22px 16px;
    }

    .header-inner {
      max-width: 650px;
      margin: auto;
    }

    .logo {
      color: var(--dark-pink);
      font-size: 32px;
      font-weight: 900;
    }

    header p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    main {
      width: min(100% - 28px, 560px);
      margin: 28px auto;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 35px #b82b6810;
      margin-bottom: 20px;
    }

    h1, h2 { text-align: center; }
    h1 { font-size: 28px; }
    h2 { font-size: 24px; }

    .subtitle {
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 16px 0 7px;
    }

    input, textarea {
      display: block;
      width: 100%;
      padding: 14px;
      font: inherit;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #fffafd;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px #ec48991c;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .primary {
      width: 100%;
      margin-top: 20px;
      background: var(--pink);
      color: white;
    }

    .primary:hover { background: var(--dark-pink); }

    .secondary {
      background: #fff0f6;
      color: var(--dark-pink);
    }

    .switch {
      text-align: center;
      color: var(--muted);
      margin-top: 20px;
      line-height: 1.8;
    }

    .switch button {
      background: transparent;
      color: var(--dark-pink);
      padding: 4px;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 14px;
      border-radius: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.show { display: block; }
    .success { background: #e8f8ed; color: #17683a; }
    .error { background: #fff0f0; color: #a21b32; }
    .info { background: #eff6ff; color: #1d4e89; }

    .hidden { display: none !important; }

    .account-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .account-bar strong { overflow-wrap: anywhere; }

    .avatar {
      display: block;
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      margin: 20px auto;
      border: 4px solid #ffe0ed;
      background: #fff0f6;
    }

    .hint {
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
    }

    footer {
      text-align: center;
      padding: 24px 12px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="logo">♡ LOVELY</div>
      <p>Faites de belles rencontres</p>
    </div>
  </header>

  <main>
    <div id="notice" class="message" role="status"
         aria-live="polite"></div>

    <section id="authCard" class="card">
      <h1 id="authTitle">Créer un compte</h1>
      <p id="authSubtitle" class="subtitle">
        Rejoignez Lovely et faites de belles rencontres.
      </p>

      <form id="authForm">
        <div id="signupFields">
          <label for="name">Prénom</label>
          <input id="name" type="text" maxlength="60"
                 autocomplete="given-name" required
                 placeholder="Ex. Sara">

          <label for="age">Âge (18 ans minimum)</label>
          <input id="age" type="number" min="18" max="100"
                 inputmode="numeric" required placeholder="19">
        </div>

        <label for="email">Adresse e-mail</label>
        <input id="email" type="email" autocomplete="email"
               required placeholder="vous@exemple.com">

        <label for="password">Mot de passe</label>
        <input id="password" type="password" minlength="6"
               autocomplete="new-password" required
               placeholder="6 caractères minimum">

        <button id="authSubmit" class="primary" type="submit">
          Créer mon compte
        </button>
      </form>

      <div class="switch">
        <span id="switchText">Vous avez déjà un compte ?</span>
        <button id="switchMode" type="button">Se connecter</button>
      </div>
    </section>

    <section id="profileCard" class="card hidden">
      <div class="account-bar">
        <strong id="signedInEmail"></strong>
        <button id="logoutButton" class="secondary" type="button">
          Déconnexion
        </button>
      </div>

      <h2>Mon profil Lovely</h2>
      <p class="subtitle">Complétez votre profil.</p>

      <img id="avatarPreview" class="avatar"
           alt="Photo de profil"
           src="https://placehold.co/240x240/fce7f3/be185d?text=Lovely">

      <form id="profileForm">
        <label for="profileName">Prénom</label>
        <input id="profileName" type="text" maxlength="60" required>

        <label for="profileAge">Âge</label>
        <input id="profileAge" type="number" min="18" max="100" required>

        <label for="bio">À propos de moi</label>
        <textarea id="bio" maxlength="500"
                  placeholder="Parlez un peu de vous..."></textarea>

        <label for="avatarFile">Photo de profil</label>
        <input id="avatarFile" type="file"
               accept="image/jpeg,image/png,image/webp">

        <p class="hint">
          Formats JPG, PNG ou WebP. Taille maximale : 3 Mo.
        </p>

        <button id="saveProfileButton" class="primary" type="submit">
          Enregistrer mon profil
        </button>
      </form>
    </section>
  </main>

  <footer>LOVELY © 2026 · Respect, sécurité et belles rencontres</footer>

  <script>
    "use strict";

    // Configuration de votre projet Supabase
    const SUPABASE_URL =
      "https://tmarzbmxteddwzliluba.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_C6a8W0g77SAW-M9TNZLeWA_8_N71VT-";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const $ = id => document.getElementById(id);

    const authCard = $("authCard");
    const profileCard = $("profileCard");
    const authForm = $("authForm");
    const profileForm = $("profileForm");
    const notice = $("notice");

    const authTitle = $("authTitle");
    const authSubtitle = $("authSubtitle");
    const signupFields = $("signupFields");
    const authSubmit = $("authSubmit");
    const switchText = $("switchText");
    const switchMode = $("switchMode");

    const nameInput = $("name");
    const ageInput = $("age");
    const emailInput = $("email");
    const passwordInput = $("password");

    const profileName = $("profileName");
    const profileAge = $("profileAge");
    const bioInput = $("bio");
    const avatarFile = $("avatarFile");
    const avatarPreview = $("avatarPreview");
    const saveProfileButton = $("saveProfileButton");
    const logoutButton = $("logoutButton");

    const DEFAULT_AVATAR =
      "https://placehold.co/240x240/fce7f3/be185d?text=Lovely";

    let mode = "signup";
    let currentUser = null;
    let currentAvatarUrl = null;
    let previewObjectUrl = null;

    function showMessage(message, type = "info") {
      notice.textContent = message;
      notice.className = "message show " + type;
    }

    function clearMessage() {
      notice.textContent = "";
      notice.className = "message";
    }

    function friendlyError(error) {
      const message = error?.message || "Une erreur est survenue.";
      const lower = message.toLowerCase();

      if (lower.includes("invalid login credentials")) {
        return "E-mail ou mot de passe incorrect.";
      }

      if (lower.includes("user already registered")) {
        return "Cette adresse e-mail possède déjà un compte. Connectez-vous.";
      }

      if (lower.includes("email not confirmed")) {
        return "Confirmez votre adresse e-mail avant de vous connecter.";
      }

      if (lower.includes("could not find the") &&
          lower.includes("column")) {
        return "Une colonne manque dans profiles. Exécutez le SQL fourni avant de réessayer.";
      }

      if (lower.includes("row-level security") ||
          lower.includes("permission denied") ||
          lower.includes("violates row-level security")) {
        return "Accès refusé par les politiques de sécurité Supabase. Vérifiez les politiques RLS.";
      }

      if (lower.includes("failed to fetch")) {
        return "Connexion impossible à Supabase. Vérifiez votre connexion Internet et la configuration.";
      }

      return message;
    }

    function setBusy(button, busy, normalText, busyText) {
      button.disabled = busy;
      button.textContent = busy ? busyText : normalText;
    }

    function setMode(nextMode) {
      mode = nextMode;
      const isSignup = mode === "signup";

      authTitle.textContent = isSignup
        ? "Créer un compte" : "Connexion";

      authSubtitle.textContent = isSignup
        ? "Rejoignez Lovely et faites de belles rencontres."
        : "Connectez-vous pour retrouver votre profil.";

      signupFields.classList.toggle("hidden", !isSignup);
      nameInput.required = isSignup;
      ageInput.required = isSignup;

      passwordInput.autocomplete = isSignup
        ? "new-password" : "current-password";

      authSubmit.textContent = isSignup
        ? "Créer mon compte" : "Se connecter";

      switchText.textContent = isSignup
        ? "Vous avez déjà un compte ?"
        : "Vous n'avez pas de compte ?";

      switchMode.textContent = isSignup
        ? "Se connecter" : "Créer un compte";

      clearMessage();
    }

    switchMode.addEventListener("click", () => {
      setMode(mode === "signup" ? "login" : "signup");
    });

    // Crée le profil seulement s'il n'existe pas déjà.
    // Cela évite d'écraser les données à chaque connexion.
    async function loadProfile(user) {
      const { data, error } = await supabaseClient
        .from("profiles")
        .select("id, name, age, bio, avatar_url")
        .eq("id", user.id)
        .maybeSingle();

      if (error) throw error;

      let profile = data;

      if (!profile) {
        const metadata = user.user_metadata || {};

        const newProfile = {
          id: user.id,
          name: metadata.name || "",
          age: metadata.age ? Number(metadata.age) : null,
          bio: "",
          avatar_url: null
        };

        const { data: created, error: createError } =
          await supabaseClient
            .from("profiles")
            .insert(newProfile)
            .select("id, name, age, bio, avatar_url")
            .single();

        if (createError) throw createError;
        profile = created;
      }

      profileName.value = profile.name || user.user_metadata?.name || "";
      profileAge.value = profile.age || user.user_metadata?.age || "";
      bioInput.value = profile.bio || "";

      currentAvatarUrl = profile.avatar_url || null;
      avatarPreview.src = currentAvatarUrl || DEFAULT_AVATAR;
    }

    async function renderSession(user) {
      currentUser = user || null;

      if (!user) {
        authCard.classList.remove("hidden");
        profileCard.classList.add("hidden");
        return;
      }

      authCard.classList.add("hidden");
      profileCard.classList.remove("hidden");
      $("signedInEmail").textContent = user.email || "Compte Lovely";

      try {
        await loadProfile(user);
      } catch (error) {
        console.error("Erreur profil:", error);
        showMessage(
          "Vous êtes connecté, mais le profil ne peut pas être chargé : " +
          friendlyError(error),
          "error"
        );
      }
    }

    // Inscription et connexion
    authForm.addEventListener("submit", async event => {
      event.preventDefault();
      clearMessage();

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const submittingMode = mode;

      setBusy(
        authSubmit, true,
        submittingMode === "signup" ? "Créer mon compte" : "Se connecter",
        "Veuillez patienter..."
      );

      try {
        if (submittingMode === "signup") {
          const name = nameInput.value.trim();
          const age = Number(ageInput.value);

          if (!name) throw new Error("Entrez votre prénom.");

          if (!Number.isInteger(age) || age < 18 || age > 100) {
            throw new Error("Vous devez avoir entre 18 et 100 ans.");
          }

          if (password.length < 6) {
            throw new Error("Le mot de passe doit contenir au moins 6 caractères.");
          }

          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              data: { name, age }
            }
          });

          if (error) throw error;

          if (data.session && data.user) {
            await renderSession(data.user);
            showMessage(
              "Bienvenue sur Lovely ! Votre compte est créé.",
              "success"
            );
          } else {
            // Avec la confirmation d'e-mail activée,
            // Supabase peut ne pas ouvrir de session immédiatement.
            setMode("login");
            emailInput.value = email;
            passwordInput.value = "";

            showMessage(
              "Compte créé ! Consultez votre boîte e-mail et confirmez votre adresse. Ensuite, connectez-vous.",
              "success"
            );
          }
        } else {
          const { data, error } =
            await supabaseClient.auth.signInWithPassword({
              email,
              password
            });

          if (error) throw error;

          await renderSession(data.user);
          showMessage("Connexion réussie. Bienvenue sur Lovely !", "success");
        }
      } catch (error) {
        console.error("Erreur authentification:", error);
        showMessage(friendlyError(error), "error");
      } finally {
        setBusy(
          authSubmit,
          false,
          mode === "signup" ? "Créer mon compte" : "Se connecter",
          "Veuillez patienter..."
        );
      }
    });

    // Aperçu de la photo avant l'envoi
    avatarFile.addEventListener("change", () => {
      const file = avatarFile.files?.[0];
      if (!file) return;

      const allowedTypes = [
        "image/jpeg", "image/png", "image/webp"
      ];

      if (!allowedTypes.includes(file.type)) {
        avatarFile.value = "";
        showMessage("Choisissez une image JPG, PNG ou WebP.", "error");
        return;
      }

      if (file.size > 3 * 1024 * 1024) {
        avatarFile.value = "";
        showMessage("La photo doit faire au maximum 3 Mo.", "error");
        return;
      }

      if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);

      previewObjectUrl = URL.createObjectURL(file);
      avatarPreview.src = previewObjectUrl;
      clearMessage();
    });

    // Enregistrement du profil et de la photo
    profileForm.addEventListener("submit", async event => {
      event.preventDefault();
      clearMessage();

      if (!currentUser) {
        showMessage("Connectez-vous avant d'enregistrer votre profil.", "error");
        return;
      }

      const name = profileName.value.trim();
      const age = Number(profileAge.value);
      const bio = bioInput.value.trim();
      const file = avatarFile.files?.[0];

      if (!name) {
        showMessage("Entrez votre prénom.", "error");
        return;
      }

      if (!Number.isInteger(age) || age < 18 || age > 100) {
        showMessage("L'âge doit être compris entre 18 et 100 ans.", "error");
        return;
      }

      setBusy(
        saveProfileButton, true,
        "Enregistrer mon profil", "Enregistrement..."
      );

      try {
        let avatarUrl = currentAvatarUrl;

        if (file) {
          const extension = file.type === "image/png" ? "png"
            : file.type === "image/webp" ? "webp" : "jpg";

          const path = currentUser.id + "/" +
            crypto.randomUUID() + "." + extension;

          const { error: uploadError } = await supabaseClient
            .storage
            .from("avatars")
            .upload(path, file, {
              contentType: file.type,
              upsert: false
            });

          if (uploadError) throw uploadError;

          const { data: publicData } = supabaseClient
            .storage
            .from("avatars")
            .getPublicUrl(path);

          avatarUrl = publicData.publicUrl;
        }

        const { error: profileError } = await supabaseClient
          .from("profiles")
          .upsert({
            id: currentUser.id,
            name,
            age,
            bio,
            avatar_url: avatarUrl
          }, { onConflict: "id" });

        if (profileError) throw profileError;

        currentAvatarUrl = avatarUrl;

        const { error: metadataError } =
          await supabaseClient.auth.updateUser({
            data: { name, age }
          });

        if (metadataError) {
          console.warn("Métadonnées non actualisées:", metadataError);
        }

        avatarFile.value = "";

        if (previewObjectUrl) {
          URL.revokeObjectURL(previewObjectUrl);
          previewObjectUrl = null;
        }

        avatarPreview.src = avatarUrl || DEFAULT_AVATAR;

        showMessage(
          "Votre profil a été enregistré avec succès !",
          "success"
        );
      } catch (error) {
        console.error("Erreur enregistrement:", error);
        showMessage(friendlyError(error), "error");
      } finally {
        setBusy(
          saveProfileButton, false,
          "Enregistrer mon profil", "Enregistrement..."
        );
      }
    });

    // Déconnexion
    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;

      try {
        const { error } = await supabaseClient.auth.signOut();
        if (error) throw error;

        currentUser = null;
        currentAvatarUrl = null;

        profileForm.reset();
        authForm.reset();
        setMode("login");

        await renderSession(null);
        showMessage("Vous êtes déconnecté.", "success");
      } catch (error) {
        showMessage(friendlyError(error), "error");
      } finally {
        logoutButton.disabled = false;
      }
    });

    // Restaurer la session lorsque la page s'ouvre
    async function initLovely() {
      try {
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) throw error;

        await renderSession(data.session?.user || null);
      } catch (error) {
        console.error("Erreur de session:", error);
        showMessage(
          "Impossible de charger la session : " + f
