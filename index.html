
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ec4899">
  <title>Lovely ❤️ - Rencontres</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --pink: #ec4899;
      --dark: #db2777;
      --bg: #fff3f8;
      --text: #342330;
      --muted: #806b79;
      --border: #f1dce7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #fff7fb, #ffe4ef);
    }

    header {
      padding: 22px 16px;
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 650px;
      margin: auto;
    }

    .logo {
      color: var(--pink);
      font-size: 30px;
      font-weight: 900;
    }

    header p { color: var(--muted); margin: 6px 0 0; }

    main {
      width: min(100% - 28px, 540px);
      margin: 28px auto;
      min-height: 60vh;
    }

    .card {
      padding: 24px;
      margin-bottom: 20px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 10px 35px #b82b6810;
    }

    h1, h2 { text-align: center; }
    h1 { font-size: 26px; }
    h2 { font-size: 22px; }

    .subtitle {
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input, textarea {
      display: block;
      width: 100%;
      padding: 13px;
      font: inherit;
      color: var(--text);
      background: #fffafd;
      border: 1px solid var(--border);
      border-radius: 11px;
    }

    input:focus, textarea:focus {
      outline: 2px solid #f9a8d4;
      border-color: var(--pink);
    }

    textarea { min-height: 100px; resize: vertical; }

    button {
      padding: 13px 16px;
      border: 0;
      border-radius: 11px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    .primary {
      width: 100%;
      margin-top: 18px;
      color: white;
      background: var(--pink);
    }

    .primary:hover { background: var(--dark); }

    .secondary {
      color: var(--dark);
      background: #fff0f6;
    }

    .switch {
      margin-top: 18px;
      color: var(--muted);
      text-align: center;
      line-height: 2;
    }

    .switch button {
      padding: 4px;
      color: var(--dark);
      background: transparent;
    }

    .message {
      display: none;
      margin-bottom: 16px;
      padding: 13px;
      border-radius: 11px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.show { display: block; }
    .success { background: #e9f9ef; color: #17683a; }
    .error { background: #fff0f0; color: #a21b32; }
    .info { background: #eff6ff; color: #1d4e89; }

    .hidden { display: none !important; }

    .account-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .account-bar strong { overflow-wrap: anywhere; }

    .avatar {
      display: block;
      width: 120px;
      height: 120px;
      margin: 20px auto;
      border: 4px solid #ffe0ed;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg);
    }

    .hint { color: var(--muted); font-size: 12px; line-height: 1.6; }

    footer {
      padding: 25px 12px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>
<header>
  <div class="header-inner">
    <div class="logo">♡ LOVELY 💗</div>
    <p>Faites de belles rencontres</p>
  </div>
</header>

<main>
  <div id="notice" class="message" role="status" aria-live="polite"></div>

  <section id="authCard" class="card">
    <h1 id="authTitle">Créer un compte</h1>
    <p id="authSubtitle" class="subtitle">
      Rejoignez Lovely et créez votre profil.
    </p>

    <form id="authForm">
      <div id="signupFields">
        <label for="name">Prénom</label>
        <input id="name" type="text" maxlength="60"
          autocomplete="given-name" placeholder="Ex. Sara" required>

        <label for="age">Âge (18 ans minimum)</label>
        <input id="age" type="number" min="18" max="100"
          inputmode="numeric" placeholder="18 ou plus" required>
      </div>

      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" autocomplete="email"
        placeholder="vous@exemple.com" required>

      <label for="password">Mot de passe</label>
      <input id="password" type="password" minlength="6"
        autocomplete="new-password" placeholder="6 caractères minimum" required>

      <button id="authSubmit" class="primary" type="submit">
        Créer mon compte
      </button>
    </form>

    <div class="switch">
      <span id="switchText">Vous avez déjà un compte ?</span>
      <button id="switchMode" type="button">Se connecter</button>
      <br>
      <button id="resetPassword" type="button">Mot de passe oublié ?</button>
    </div>
  </section>

  <section id="profileCard" class="card hidden">
    <div class="account-bar">
      <strong id="signedInEmail"></strong>
      <button id="logoutButton" class="secondary" type="button">
        Déconnexion
      </button>
    </div>

    <h2>Mon profil Lovely</h2>
    <p class="subtitle">Complétez votre profil.</p>

    <img id="avatarPreview" class="avatar"
      alt="Photo de profil"
      src="https://placehold.co/240x240/fce7f3/be185d?text=Lovely">

    <form id="profileForm">
      <label for="profileName">Prénom</label>
      <input id="profileName" type="text" maxlength="60" required>

      <label for="profileAge">Âge (18 ans minimum)</label>
      <input id="profileAge" type="number" min="18" max="100" required>

      <label for="bio">À propos de moi</label>
      <textarea id="bio" maxlength="500"
        placeholder="Parlez un peu de vous..."></textarea>

      <label for="avatarFile">Photo de profil</label>
      <input id="avatarFile" type="file"
        accept="image/jpeg,image/png,image/webp">

      <p class="hint">JPG, PNG ou WebP. Maximum 3 Mo.</p>

      <button id="saveProfileButton" class="primary" type="submit">
        Enregistrer mon profil
      </button>
    </form>
  </section>
</main>

<footer>LOVELY © 2026 · Respect, sécurité et belles rencontres</footer>

<script>
"use strict";

/* Configuration : URL du projet et clé publique */
const SUPABASE_URL = "https://tmarzbmxteddwzliluba.supabase.co";
const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_C6a8W0g77SAW-M9TNZLeWA_8_N71VT-";

const $ = id => document.getElementById(id);
const notice = $("notice");
const authCard = $("authCard");
const profileCard = $("profileCard");
const authForm = $("authForm");
const profileForm = $("profileForm");
const authTitle = $("authTitle");
const authSubtitle = $("authSubtitle");
const signupFields = $("signupFields");
const authSubmit = $("authSubmit");
const switchText = $("switchText");
const switchMode = $("switchMode");
const nameInput = $("name");
const ageInput = $("age");
const emailInput = $("email");
const passwordInput = $("password");
const profileName = $("profileName");
const profileAge = $("profileAge");
const bioInput = $("bio");
const avatarFile = $("avatarFile");
const avatarPreview = $("avatarPreview");
const saveProfileButton = $("saveProfileButton");
const logoutButton = $("logoutButton");

const DEFAULT_AVATAR =
  "https://placehold.co/240x240/fce7f3/be185d?text=Lovely";

let supabaseClient = null;
let mode = "signup";
let currentUser = null;
let currentAvatarUrl = null;
let previewObjectUrl = null;

function showMessage(message, type = "info") {
  notice.textContent = message;
  notice.className = "message show " + type;
}

function clearMessage() {
  notice.textContent = "";
  notice.className = "message";
}

function friendlyError(error) {
  const message = error?.message || "Une erreur est survenue.";

  if (/invalid login credentials/i.test(message))
    return "E-mail ou mot de passe incorrect.";

  if (/email not confirmed/i.test(message))
    return "Confirmez votre adresse e-mail avant de vous connecter.";

  if (/user already registered/i.test(message))
    return "Cette adresse e-mail existe déjà. Connectez-vous.";

  if (/row-level security|permission denied/i.test(message))
    return "Accès refusé. Vérifiez les politiques RLS de Supabase.";

  if (/could not find the .* column/i.test(message))
    return "Une colonne manque dans profiles. Vérifiez le schéma de la base.";

  if (/failed to fetch|networkerror|load failed/i.test(message))
    return "Connexion impossible. Vérifiez Internet et l'URL Supabase.";

  return message;
}

function setBusy(button, busy, normalText, busyText) {
  button.disabled = busy;
  button.textContent = busy ? busyText : normalText;
}

/* Initialiser Supabase */
try {
  if (!window.supabase) {
    throw new Error("La bibliothèque Supabase ne s'est pas chargée.");
  }

  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
} catch (error) {
  showMessage(friendlyError(error), "error");
  console.error(error);
}

/* Basculer entre inscription et connexion */
function setMode(nextMode) {
  mode = nextMode;
  const signup = mode === "signup";

  authTitle.textContent = signup ? "Créer un compte" : "Connexion";
  authSubtitle.textContent = signup
    ? "Rejoignez Lovely et créez votre profil."
    : "Connectez-vous pour retrouver votre profil.";

  signupFields.classList.toggle("hidden", !signup);
  nameInput.required = signup;
  ageInput.required = signup;
  passwordInput.autocomplete = signup ? "new-password" : "current-password";

  authSubmit.textContent = signup ? "Créer mon compte" : "Se connecter";
  switchText.textContent = signup
    ? "Vous avez déjà un compte ?"
    : "Vous n'avez pas de compte ?";
  switchMode.textContent = signup ? "Se connecter" : "Créer un compte";

  clearMessage();
}

switchMode.addEventListener("click", () => {
  setMode(mode === "signup" ? "login" : "signup");
});

/* Charger ou créer le profil */
async function loadProfile(user) {
  const { data, error } = await supabaseClient
    .from("profiles")
    .select("id, name, age, bio, avatar_url")
    .eq("id", user.id)
    .maybeSingle();

  if (error) throw error;

  let profile = data;

  if (!profile) {
    const metadata = user.user_metadata || {};
    const newProfile = {
      id: user.id,
      name: metadata.name || "",
      age: metadata.age ? Number(metadata.age) : null,
      bio: "",
      avatar_url: null
    };

    const { data: created, error: createError } = await supabaseClient
      .from("profiles")
      .upsert(newProfile, { onConflict: "id" })
      .select("id, name, age, bio, avatar_url")
      .single();

    if (createError) throw createError;
    profile = created;
  }

  profileName.value = profile.name || user.user_metadata?.name || "";
  profileAge.value = profile.age || user.user_metadata?.age || "";
  bioInput.value = profile.bio || "";

  currentAvatarUrl = profile.avatar_url || null;
  avatarPreview.src = currentAvatarUrl || DEFAULT_AVATAR;
}

/* Afficher l'écran correspondant à la session */
async function renderSession(user) {
  currentUser = user || null;

  if (!user) {
    authCard.classList.remove("hidden");
    profileCard.classList.add("hidden");
    return;
  }

  authCard.classList.add("hidden");
  profileCard.classList.remove("hidden");
  $("signedInEmail").textContent = user.email || "Compte Lovely";

  await loadProfile(user);
}

/* Inscription et connexion */
authForm.addEventListener("submit", async event => {
  event.preventDefault();
  clearMessage();

  if (!supabaseClient) {
    showMessage("Supabase n'est pas initialisé. Rechargez la page.", "error");
    return;
  }

  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const signup = mode === "signup";
  const normalText = signup ? "Créer mon compte" : "Se connecter";

  setBusy(authSubmit, true, normalText, "Veuillez patienter...");

  try {
    if (signup) {
      const name = nameInput.value.trim();
      const age = Number(ageInput.value);

      if (!name) throw new Error("Entrez votre prénom.");
      if (!Number.isInteger(age) || age < 18 || age > 100)
        throw new Error("L'âge doit être compris entre 18 et 100 ans.");
      if (password.length < 6)
        throw new Error("Le mot de passe doit contenir au moins 6 caractères.");

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { name, age } }
      });

      if (error) throw error;

      if (data.session && data.user) {
        await renderSession(data.user);
        showMessage("Bienvenue sur Lovely !", "success");
      } else {
        setMode("login");
        emailInput.value = email;
        showMessage(
          "Compte créé ! Consultez votre e-mail pour confirmer votre adresse, puis connectez-vous.",
          "success"
        );
      }
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      await renderSession(data.user);
      showMessage("Connexion réussie. Bienvenue sur Lovely !", "success");
    }
  } catch (error) {
    console.error("Erreur Auth:", error);
    showMessage(friendlyError(error), "error");
  } finally {
    setBusy(
      authSubmit,
      false,
      mode === "signup" ? "Créer mon compte" : "Se connecter",
      ""
    );
  }
});

/* Mot de passe oublié */
$("resetPassword").addEventListener("click", async () => {
  if (!supabaseClient) {
    showMessage("Supabase n'est pas disponible.", "error");
    return;
  }

  const email = emailInput.value.trim();

  if (!email) {
    showMessage("Entrez d'abord votre adresse e-mail.", "info");
    emailInput.focus();
    return;
  }

  try {
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });

    if (error) throw error;

    showMessage(
      "Si cette adresse est enregistrée, un e-mail de réinitialisation sera envoyé.",
      "success"
    );
  } catch (error) {
    showMessage(friendlyError(error), "error");
  }
});

/* Prévisualiser la photo */
avatarFile.addEventListener("change", () => {
  clearMessage();
  const file = avatarFile.files?.[0];

  if (!file) return;

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    avatarFile.value = "";
    showMessage("Choisissez une image JPG, PNG ou WebP.", "error");
    return;
  }

  if (file.size > 3 * 1024 * 1024) {
    avatarFile.value = "";
    showMessage("La photo doit faire moins de 3 Mo.", "error");
    return;
  }

  if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
  previewObjectUrl = URL.createObjectURL(file);
  avatarPreview.src = previewObjectUrl;
});

/* Enregistrer le profil et la photo */
profileForm.addEventListener("submit", async event => {
  event.preventDefault();
  clearMessage();

  if (!supabaseClient || !currentUser) {
    showMessage("Connectez-vous avant d'enregistrer votre profil.", "error");
    return;
  }

  const name = profileName.value.trim();
  const age = Number(profileAge.value);
  const bio = bioInput.value.trim();
  const file = avatarFile.files?.[0];

  if (!name) {
    showMessage("Entrez votre prénom.", "error");
    return;
  }

  if (!Number.isInteger(age) || age < 18 || age > 100) {
    showMessage("L'âge doit être compris entre 18 et 100 ans.", "error");
    return;
  }

  setBusy(saveProfileButton, true, "Enregistrer mon profil", "Enregistrement...");

  try {
    let avatarUrl = currentAvatarUrl;

    if (file) {
      if (file.size > 3 * 1024 * 1024)
        throw new Error("La photo doit faire moins de 3 Mo.");

      const extension = file.type === "image/png" ? "png"
        : file.type === "image/webp" ? "webp" : "jpg";

      const path = currentUser.id + "/" + crypto.randomUUID() + "." + extension;

      const { error: uploadError } = await supabaseClient.storage
        .from("avatars")
        .upload(path, file, {
          contentType: file.type,
          upsert: false
        });

      if (uploadError) throw uploadError;

      avatarUrl = supabaseClient.storage.from("avatars").getPublicUrl(path)
        .data.publicUrl;
    }

    const { error } = await supabaseClient.from("profiles").upsert({
      id: currentUser.id,
      name,
      age,
      bio,
      avatar_url: avatarUrl
    }, { onConflict: "id" });

    if (error) throw error;

    const { error: metadataError } = await supabaseClient.auth.updateUser({
      data: { name, age }
    });

    if (metadataError) console.warn("Métadonnées:", metadataError);

    currentAvatarUrl = avatarUrl;
    avatarPreview.src = avatarUrl || DEFAULT_AVATAR;
    avatarFile.value = "";

    if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
    previewObjectUrl = null;

    showMessage("Votre profil a été enregistré avec succès !", "success");
  } catch (error) {
    console.error("Erreur profil:", error);
    showMessage(friendlyError(error), "error");
  } finally {
    setBusy(saveProfileButton, false, "Enregistrer mon profil", "");
  }
});

/* Déconnexion */
logoutButton.addEventListener("click", async () => {
  if (!supabaseClient) return;

  logoutButton.disabled = true;

  try {
    const { error } = await supabaseClient.auth.signOut();
    if (error) throw error;

    currentUser = null;
    currentAvatarUrl = null;
    authForm.reset();
    profileForm.reset();
    setMode("login");
    await renderSession(null);
    showMessage("Vous êtes déconnecté.", "success");
  } catch (error) {
    showMessage(friendlyError(error), "error");
  } finally {
    logoutButton.disabled = false;
  }
});

/* Restaurer la session au chargement */
async function init() {
  if (!supabaseClient) {
    showMessage("Impossible d'initialiser Supabase. Vérifiez la connexion.", "error");
    return;
  }

  try {
    const { data, error } = await supabaseClient.auth.getSession();
    if (error) throw error;
    await renderSession(data.session?.user || null);
  } catch (error) {
    console.error("Erreur au démarrage:", error);
    showMessage(friendlyError(error), "error");
  }
}

/* IMPORTANT : lancer réellement l'initialisation */
setMode("signup");
init();
</script>
</body>
</html>
